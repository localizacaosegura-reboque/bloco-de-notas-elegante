<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Elegante — Minimalista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0b0d12;
      --card-bg: #12151e;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --border-color: #1e2330;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .container {
      width: 100%;
      max-width: 800px;
      height: 92vh;
      max-height: 820px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Cabeçalho Compacto */
    header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      background: rgba(100, 116, 139, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(100, 116, 139, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .status-badge.saved {
      background: rgba(99, 102, 241, 0.1);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.25);
    }

    /* Barra de Modelos Minimalista */
    .templates-bar {
      display: flex;
      gap: 0.35rem;
      padding: 0.4rem 1rem;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .templates-bar::-webkit-scrollbar {
      display: none;
    }

    .btn-template {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #94a3b8;
      padding: 0.25rem 0.5rem;
      border-radius: 5px;
      font-size: 0.65rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-weight: 400;
    }

    .btn-template:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
      color: #e2e8f0;
    }

    /* Atalhos Minimalistas no Topo */
    .shortcuts-sub-header {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.6rem;
      padding: 0.3rem 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 0.6rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .shortcuts-sub-header span {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
    }

    kbd {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 0.02rem 0.25rem;
      font-family: var(--font-mono);
      font-size: 0.55rem;
      color: #cbd5e1;
    }

    /* Editor Rico Editável */
    .editor-container {
      width: 100%;
      flex: 1;
      background: transparent;
      border: none;
      color: #cbd5e1;
      font-family: var(--font-mono);
      font-size: 0.88rem;
      line-height: 1.5;
      padding: 1rem;
      resize: none;
      outline: none;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .editor-container:empty::before {
      content: "Escreva seu texto base ou selecione um modelo acima...";
      color: #2a324b;
      font-weight: normal;
    }

    /* Estilização para Rótulos (Negrito) */
    .editor-label {
      font-weight: 600;
      color: #ffffff;
    }

    /* Marcador invisível de parada do Tab */
    .tab-stop {
      display: inline-block;
      width: 0;
      height: 0;
      overflow: hidden;
      vertical-align: baseline;
    }

    /* Rodapé Compacto */
    footer {
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      width: 100%;
      justify-content: space-between;
    }

    button {
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      flex: 1 1 calc(16.66% - 0.35rem);
      min-width: 90px;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    button.btn-primary {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
    }

    button.btn-primary:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    button.btn-warning:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    button.btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #ffffff;
    }

    @media (max-width: 600px) {
      body {
        padding: 0.2rem;
      }
      .container {
        height: 98vh;
        border-radius: 8px;
      }
      footer {
        padding: 0.4rem;
      }
      button {
        flex: 1 1 calc(33.33% - 0.35rem);
        padding: 0.4rem 0.3rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>✦ Rascunho Limpo</h1>
      </div>
      <div id="statusBadge" class="status-badge">Nenhum ponto fixado</div>
    </header>

    <!-- Modelos Rápidos de Atendimento -->
    <div class="templates-bar">
      <button class="btn-template" onclick="loadTemplate('vr')">🚗 Veículo Reserva (Alt+1)</button>
      <button class="btn-template" onclick="loadTemplate('condutor')">👤 Condutor (Alt+2)</button>
      <button class="btn-template" onclick="loadTemplate('reboque')">🛞 Reboque (Alt+3)</button>
    </div>

    <div class="shortcuts-sub-header">
      <span><kbd>Tab</kbd> Próx. Campo</span>
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd> Fixar</span>
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> -1 Palavra</span>
      <span><kbd>Ctrl</kbd>+<kbd>Y</kbd> Refazer</span>
      <span><kbd>Ctrl</kbd>+<kbd>X</kbd> Limpar Rascunho</span>
      <span><kbd>Alt</kbd>+<kbd>C</kbd> Resetar Tudo</span>
    </div>

    <div id="editor" class="editor-container" contenteditable="true" spellcheck="false"></div>

    <footer>
      <div class="controls-grid">
        <button id="btnFix" class="btn-primary" title="Fixar Texto (Ctrl + S)">
          <span>📌</span> Fixar (Ctrl+S)
        </button>
        <button id="btnUndoWord" title="Apagar Palavra (Ctrl + Z)">
          <span>⌫</span> -1 Palavra
        </button>
        <button id="btnRedo" title="Refazer Palavra (Ctrl + Y)">
          <span>↪</span> Refazer
        </button>
        <button id="btnRestoreRascunho" title="Restaurar Rascunho Limpo (Ctrl + R)">
          <span>🔄</span> Restaurar
        </button>
        <button id="btnClear" class="btn-warning" title="Limpar Rascunho (Ctrl + X)">
          <span>🗑</span> Limpar (Ctrl+X)
        </button>
        <button id="btnResetAll" class="btn-danger" title="Zerar tudo incluindo Fixados (Alt + C)">
          <span>🔥</span> Resetar Tudo
        </button>
      </div>
    </footer>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const statusBadge = document.getElementById('statusBadge');
    const btnFix = document.getElementById('btnFix');
    const btnUndoWord = document.getElementById('btnUndoWord');
    const btnRedo = document.getElementById('btnRedo');
    const btnRestoreRascunho = document.getElementById('btnRestoreRascunho');
    const btnClear = document.getElementById('btnClear');
    const btnResetAll = document.getElementById('btnResetAll');

    let pinnedHTML = null;
    let wordHistory = [];
    let lastClearedDraft = null;

    const TAB_STOP_HTML = '<span class="tab-stop"></span>';

    // Modelos com cabeçalhos e rótulos levemente em negrito e marcadores invisíveis
    const templates = {
      vr: `<span class="editor-label">========== VEÍCULO RESERVA ===========</span>\n<span class="editor-label">NOME: </span>${TAB_STOP_HTML}\n<span class="editor-label">CHASSI: </span>${TAB_STOP_HTML}\n<span class="editor-label">PLACA: </span>${TAB_STOP_HTML}\n<span class="editor-label">CPF: </span>${TAB_STOP_HTML}\n<span class="editor-label">TEL.: </span>${TAB_STOP_HTML}\n<span class="editor-label">CASO: SOL. VR POR M</span>${TAB_STOP_HTML}\n<span class="editor-label">END. PAX: </span>${TAB_STOP_HTML}\n<span class="editor-label">END. CSS: </span>${TAB_STOP_HTML}\n<span class="editor-label">ASSIST VR SOL.</span>\n<span class="editor-label">CIENTE DA PRÉVIA INICIAL DE H ÚTEIS PARA ANÁLISE DO SETOR RESP.</span>`,
      condutor: `<span class="editor-label">============== CONDUTOR ==============</span>\n<span class="editor-label">NOME: </span>${TAB_STOP_HTML}\n<span class="editor-label">CPF: </span>${TAB_STOP_HTML}\n<span class="editor-label">TEL.: </span>${TAB_STOP_HTML}\n<span class="editor-label">>21 ANOS? SIM</span>\n<span class="editor-label">HAB. > 2 ANOS? SIM</span>\n<span class="editor-label">CC COM LIM. >= R$ 1K? SIM</span>\n<span class="editor-label">OBS: </span>${TAB_STOP_HTML}`,
      reboque: `<span class="editor-label">============== REBOQUE ===============</span>\n<span class="editor-label">NOME: </span>${TAB_STOP_HTML}\n<span class="editor-label">CHASSI: </span>${TAB_STOP_HTML}\n<span class="editor-label">PLACA: </span>${TAB_STOP_HTML}\n<span class="editor-label">CPF: </span>${TAB_STOP_HTML}\n<span class="editor-label">TEL.: </span>${TAB_STOP_HTML}\n<span class="editor-label">CASO: SOL. REB POR MOTIVOS </span>${TAB_STOP_HTML}\n<span class="editor-label">ORIG.: </span>${TAB_STOP_HTML}\n<span class="editor-label">VIA PÚB? N. SUBSOLO? N. RODAS/CÂMBIO/DIR. TRAVADOS? N.</span>\n<span class="editor-label">CIENTE PRAZO INIC. 75 MIN.</span>\n<span class="editor-label">CIENTE AGEND. PARA </span>${TAB_STOP_HTML}<span class="editor-label">XX ÀS </span>${TAB_STOP_HTML}<span class="editor-label">XH</span>`
    };

    function loadTemplate(key) {
      if (templates[key]) {
        const htmlToInsert = templates[key];
        if (editor.innerText.trim() === '') {
          editor.innerHTML = htmlToInsert;
        } else {
          editor.innerHTML += '\n\n' + htmlToInsert;
        }
        editor.focus();
        jumpToNextField();
      }
    }

    // Navegar para o próximo marcador invisível com TAB
    function jumpToNextField() {
      const stops = Array.from(editor.querySelectorAll('.tab-stop'));
      if (stops.length === 0) return;

      const sel = window.getSelection();
      let currentPosNode = null;
      if (sel.rangeCount > 0) {
        currentPosNode = sel.getRangeAt(0).startContainer;
      }

      let nextStop = stops.find(stop => {
        return (stop.compareDocumentPosition(currentPosNode) & Node.DOCUMENT_POSITION_PRECEDING) !== 0;
      });

      if (!nextStop) {
        nextStop = stops[0];
      }

      const range = document.createRange();
      range.setStartAfter(nextStop);
      range.collapse(true);
      sel.removeAllRanges();
      sel.addRange(range);
    }

    // Fixar o estado atual (Ctrl + S)
    function fixCurrentText() {
      pinnedHTML = editor.innerHTML;
      wordHistory = [];
      statusBadge.textContent = "Ponto Fixado ✓";
      statusBadge.classList.add('saved');
    }

    // Apagar palavra (Ctrl + Z)
    function deleteLastWord() {
      const sel = window.getSelection();
      if (!sel.rangeCount) return;

      const range = sel.getRangeAt(0);
      if (!range.collapsed) {
        range.deleteContents();
        return;
      }

      sel.modify("extend", "backward", "word");
      const word = sel.toString();
      if (word) {
        wordHistory.push(word);
        sel.getRangeAt(0).deleteContents();
      }
    }

    // Refazer palavra (Ctrl + Y)
    function redoLastWord() {
      if (wordHistory.length > 0) {
        const lastRemoved = wordHistory.pop();
        document.execCommand('insertText', false, lastRemoved);
      }
    }

    // Limpar Rascunho mantendo Fixado (Ctrl + X)
    function clearRascunho() {
      if (pinnedHTML !== null) {
        lastClearedDraft = editor.innerHTML.replace(pinnedHTML, '');
        editor.innerHTML = pinnedHTML;
      } else {
        lastClearedDraft = editor.innerHTML;
        editor.innerHTML = '';
      }
      wordHistory = [];
    }

    // Resetar Tudo (Alt + C)
    function resetAll() {
      editor.innerHTML = '';
      pinnedHTML = null;
      wordHistory = [];
      lastClearedDraft = null;
      statusBadge.textContent = "Nenhum ponto fixado";
      statusBadge.classList.remove('saved');
      editor.focus();
    }

    // Restaurar Rascunho Limpo (Ctrl + R)
    function restoreClearedDraft() {
      if (lastClearedDraft !== null) {
        editor.innerHTML += lastClearedDraft;
      }
    }

    // Forçar Caixa Alta mantendo formatação HTML
    editor.addEventListener('beforeinput', (e) => {
      if (e.data && e.inputType === 'insertText') {
        e.preventDefault();
        document.execCommand('insertText', false, e.data.toUpperCase());
      }
    });

    btnFix.addEventListener('click', fixCurrentText);
    btnUndoWord.addEventListener('click', deleteLastWord);
    btnRedo.addEventListener('click', redoLastWord);
    btnRestoreRascunho.addEventListener('click', restoreClearedDraft);
    btnClear.addEventListener('click', clearRascunho);
    btnResetAll.addEventListener('click', resetAll);

    // Atalhos do teclado
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      if (e.key === 'Tab') {
        e.preventDefault();
        jumpToNextField();
      }

      if (e.altKey && key === '1') {
        e.preventDefault();
        loadTemplate('vr');
      }
      if (e.altKey && key === '2') {
        e.preventDefault();
        loadTemplate('condutor');
      }
      if (e.altKey && key === '3') {
        e.preventDefault();
        loadTemplate('reboque');
      }

      if ((e.altKey && key === 'c') || (e.ctrlKey && e.shiftKey && key === 'x')) {
        e.preventDefault();
        resetAll();
      }

      if (e.ctrlKey && !e.shiftKey && key === 's') {
        e.preventDefault();
        fixCurrentText();
      }

      if (e.ctrlKey && !e.shiftKey && key === 'z') {
        e.preventDefault();
        deleteLastWord();
      }

      if (e.ctrlKey && key === 'y') {
        e.preventDefault();
        redoLastWord();
      }

      if (e.ctrlKey && !e.shiftKey && key === 'x') {
        const sel = window.getSelection();
        if (sel.isCollapsed) {
          e.preventDefault();
          clearRascunho();
        }
      }

      if (e.ctrlKey && key === 'r') {
        e.preventDefault();
        restoreClearedDraft();
      }
    });
  </script>
</body>
</html>
