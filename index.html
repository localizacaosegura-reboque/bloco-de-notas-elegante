<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Elegante — Ponto de Fixação</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0f1117;
      --card-bg: #161922;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #262b38;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      height: 90vh;
      max-height: 800px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Cabeçalho */
    header {
      padding: 0.85rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.02);
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .status-badge {
      font-size: 0.7rem;
      font-family: var(--font-mono);
      padding: 0.3rem 0.6rem;
      border-radius: 20px;
      background: rgba(148, 163, 184, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(148, 163, 184, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .status-badge.saved {
      background: rgba(99, 102, 241, 0.15);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.3);
    }

    /* Atalhos Sutis no Topo */
    .shortcuts-sub-header {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.75rem 1.25rem;
      padding: 0.5rem 0.75rem;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      font-size: 0.65rem;
      color: var(--text-muted);
      opacity: 0.4;
      transition: opacity 0.3s ease;
      flex-shrink: 0;
    }

    .shortcuts-sub-header:hover {
      opacity: 0.9;
    }

    .shortcuts-sub-header span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    kbd {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      padding: 0.05rem 0.3rem;
      font-family: var(--font-mono);
      font-size: 0.6rem;
      color: var(--text-main);
    }

    /* Área do Editor Flexível */
    textarea {
      width: 100%;
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.95rem;
      line-height: 1.6;
      padding: 1.25rem;
      resize: none;
      outline: none;
    }

    textarea::placeholder {
      color: #334155;
    }

    /* Rodapé Responsivo */
    footer {
      padding: 0.75rem 1.25rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.15);
      flex-shrink: 0;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      gap: 0.5rem;
      width: 100%;
    }

    button {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 0.5rem 0.6rem;
      border-radius: 8px;
      font-size: 0.75rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.3rem;
      width: 100%;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: var(--text-muted);
    }

    button.btn-primary {
      background: var(--accent-color);
      border-color: var(--accent-color);
    }

    button.btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    button.btn-danger:hover {
      background: rgba(239, 68, 68, 0.15);
      border-color: rgba(239, 68, 68, 0.4);
      color: #f87171;
    }

    @media (max-width: 480px) {
      body {
        padding: 0.5rem;
      }
      .container {
        height: 95vh;
        border-radius: 12px;
      }
      .controls-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1><span>✦</span> Rascunho Limpo</h1>
      </div>
      <div id="statusBadge" class="status-badge">Nenhum ponto fixado</div>
    </header>

    <div class="shortcuts-sub-header">
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd> Fixar</span>
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> -1 Palavra</span>
      <span><kbd>Ctrl</kbd>+<kbd>Y</kbd> Refazer</span>
      <span><kbd>Ctrl</kbd>+<kbd>X</kbd> Limpar Rascunho</span>
    </div>

    <textarea id="editor" placeholder="Escreva seu texto base aqui e pressione Ctrl + S para fixá-lo..."></textarea>

    <footer>
      <div class="controls-grid">
        <button id="btnFix" class="btn-primary" title="Fixar Texto (Ctrl + S)">
          <span>📌</span> Fixar (Ctrl+S)
        </button>
        <button id="btnUndoWord" title="Apagar Palavra (Ctrl + Z)">
          <span>⌫</span> Apagar Palavra
        </button>
        <button id="btnRedo" title="Refazer Palavra (Ctrl + Y)">
          <span>↪</span> Refazer
        </button>
        <button id="btnClear" class="btn-danger" title="Limpar Rascunho (Ctrl + X)">
          <span>🗑</span> Limpar Rascunho
        </button>
      </div>
    </footer>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const statusBadge = document.getElementById('statusBadge');
    const btnFix = document.getElementById('btnFix');
    const btnUndoWord = document.getElementById('btnUndoWord');
    const btnRedo = document.getElementById('btnRedo');
    const btnClear = document.getElementById('btnClear');

    let pinnedText = null;
    let wordHistory = [];

    // Fixar o texto base atual (Ctrl + S)
    function fixCurrentText() {
      pinnedText = editor.value;
      wordHistory = []; // Limpa o histórico ao fixar nova base
      statusBadge.textContent = "Ponto Fixado ✓";
      statusBadge.classList.add('saved');
      btnFix.style.transform = "scale(0.95)";
      setTimeout(() => btnFix.style.transform = "scale(1)", 150);
    }

    // Apagar palavra por palavra SEM apagar o texto fixado (Ctrl + Z)
    function deleteLastWord() {
      const currentText = editor.value;
      const minLength = pinnedText !== null ? pinnedText.length : 0;
      
      // Se já estiver no limite do texto fixado (ou vazio), não apaga
      if (currentText.length <= minLength) return;

      const editableText = currentText.slice(minLength);
      const match = editableText.match(/(\s*\S+|\s+)$/);

      if (match) {
        const removed = match[0];
        wordHistory.push(removed); // Registra no histórico para o Ctrl+Y
        editor.value = currentText.slice(0, currentText.length - removed.length);
      }
    }

    // Refazer palavra apagada (Ctrl + Y)
    function redoLastWord() {
      if (wordHistory.length > 0) {
        const lastRemoved = wordHistory.pop();
        editor.value += lastRemoved;
      }
    }

    // Limpar apenas o Rascunho, mantendo o Texto Fixado protegido (Ctrl + X)
    function clearRascunho() {
      if (pinnedText !== null) {
        editor.value = pinnedText;
      } else {
        editor.value = '';
      }
      wordHistory = []; // Reseta o histórico de refazer
    }

    btnFix.addEventListener('click', fixCurrentText);
    btnUndoWord.addEventListener('click', deleteLastWord);
    btnRedo.addEventListener('click', redoLastWord);
    btnClear.addEventListener('click', clearRascunho);

    // Atalhos do teclado
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();

      // Ctrl + S: Fixar
      if (e.ctrlKey && key === 's') {
        e.preventDefault();
        fixCurrentText();
      }

      // Ctrl + Z: Apagar Palavra (sem invadir o fixado)
      if (e.ctrlKey && !e.shiftKey && key === 'z') {
        e.preventDefault();
        deleteLastWord();
      }

      // Ctrl + Y: Refazer Palavra
      if (e.ctrlKey && key === 'y') {
        e.preventDefault();
        redoLastWord();
      }

      // Ctrl + X: Limpar apenas o Rascunho (Protege o texto fixado)
      if (e.ctrlKey && key === 'x') {
        if (editor.selectionStart === editor.selectionEnd) {
          e.preventDefault();
          clearRascunho();
        }
      }
    });
  </script>
</body>
</html>
