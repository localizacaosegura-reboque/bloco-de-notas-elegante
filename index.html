<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notepad Elegante — Minimalista</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg-color: #0b0d12;
      --card-bg: #12151e;
      --accent-color: #6366f1;
      --accent-hover: #4f46e5;
      --text-main: #f1f5f9;
      --text-muted: #64748b;
      --border-color: #1e2330;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    .container {
      width: 100%;
      max-width: 850px;
      height: 92vh;
      max-height: 820px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* Cabeçalho Compacto */
    header {
      padding: 0.6rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.01);
      flex-shrink: 0;
    }

    .title-area h1 {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.3rem;
      letter-spacing: 0.5px;
    }

    .status-badge {
      font-size: 0.65rem;
      font-family: var(--font-mono);
      padding: 0.2rem 0.5rem;
      border-radius: 12px;
      background: rgba(100, 116, 139, 0.1);
      color: var(--text-muted);
      border: 1px solid rgba(100, 116, 139, 0.2);
      transition: all 0.3s ease;
      white-space: nowrap;
    }

    .status-badge.saved {
      background: rgba(99, 102, 241, 0.1);
      color: #818cf8;
      border-color: rgba(99, 102, 241, 0.25);
    }

    .status-badge.copied {
      background: rgba(16, 185, 129, 0.1);
      color: #34d399;
      border-color: rgba(16, 185, 129, 0.25);
    }

    /* Barra de Modelos Minimalista */
    .templates-bar {
      display: flex;
      gap: 0.35rem;
      padding: 0.4rem 1rem;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--border-color);
      flex-shrink: 0;
      overflow-x: auto;
      scrollbar-width: none;
      align-items: center;
    }

    .templates-bar::-webkit-scrollbar {
      display: none;
    }

    .btn-template {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      color: #94a3b8;
      padding: 0.25rem 0.5rem;
      border-radius: 5px;
      font-size: 0.65rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-weight: 400;
    }

    .btn-template:hover {
      background: rgba(99, 102, 241, 0.15);
      border-color: rgba(99, 102, 241, 0.3);
      color: #e2e8f0;
    }

    .btn-script-trigger {
      background: rgba(245, 158, 11, 0.15);
      border: 1px solid rgba(245, 158, 11, 0.3);
      color: #fbbf24;
      padding: 0.25rem 0.6rem;
      border-radius: 5px;
      font-size: 0.65rem;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-weight: 500;
      margin-left: auto;
    }

    .btn-script-trigger:hover {
      background: rgba(245, 158, 11, 0.3);
      color: #ffffff;
    }

    /* Atalhos Minimalistas no Topo */
    .shortcuts-sub-header {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 0.35rem 0.6rem;
      padding: 0.3rem 0.75rem;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.02);
      font-size: 0.6rem;
      color: var(--text-muted);
      flex-shrink: 0;
    }

    .shortcuts-sub-header span {
      display: inline-flex;
      align-items: center;
      gap: 0.2rem;
      white-space: nowrap;
    }

    kbd {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 3px;
      padding: 0.02rem 0.25rem;
      font-family: var(--font-mono);
      font-size: 0.55rem;
      color: #cbd5e1;
    }

    /* Área de Texto Textarea Nativa */
    .editor-wrapper {
      flex: 1;
      padding: 1rem;
      overflow: hidden;
      background: transparent;
      display: flex;
      flex-direction: column;
    }

    #editor {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.88rem;
      line-height: 1.5;
      outline: none;
      resize: none;
      text-transform: uppercase;
    }

    #editor::placeholder {
      color: #2a324b;
      text-transform: none;
    }

    /* Painel Flutuante (Balão de Argumentos) */
    .script-modal {
      display: none;
      position: absolute;
      top: 45px;
      right: 15px;
      width: 360px;
      max-height: 75vh;
      background: #161922;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      z-index: 999;
      flex-direction: column;
      overflow: hidden;
    }

    .script-modal.active {
      display: flex !important;
    }

    .script-header {
      padding: 0.5rem 0.8rem;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .script-header h3 {
      font-size: 0.75rem;
      color: #fbbf24;
      font-weight: 500;
    }

    .close-modal {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9rem;
    }

    .search-box {
      padding: 0.4rem 0.6rem;
      border-bottom: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
    }

    .search-box input {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      color: var(--text-main);
      font-size: 0.7rem;
      outline: none;
    }

    .script-content {
      padding: 0.6rem;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }

    .script-card {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 5px;
      padding: 0.5rem;
    }

    .script-title {
      font-size: 0.68rem;
      font-weight: 600;
      color: #818cf8;
      margin-bottom: 0.2rem;
    }

    .script-text {
      font-size: 0.65rem;
      color: #cbd5e1;
      line-height: 1.35;
      margin-bottom: 0.3rem;
      white-space: pre-line;
    }

    .btn-insert {
      background: rgba(99, 102, 241, 0.15);
      border: 1px solid rgba(99, 102, 241, 0.3);
      color: #c7d2fe;
      font-size: 0.58rem;
      padding: 0.2rem 0.4rem;
      border-radius: 3px;
      cursor: pointer;
    }

    .btn-insert:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    /* Rodapé Compacto */
    footer {
      padding: 0.5rem 1rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 0, 0, 0.2);
      flex-shrink: 0;
    }

    .controls-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      width: 100%;
      justify-content: space-between;
    }

    button {
      background: rgba(255, 255, 255, 0.03);
      color: #cbd5e1;
      border: 1px solid rgba(255, 255, 255, 0.06);
      padding: 0.35rem 0.5rem;
      border-radius: 6px;
      font-size: 0.68rem;
      font-weight: 400;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      flex: 1 1 calc(14.28% - 0.35rem);
      min-width: 85px;
      white-space: nowrap;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.15);
      color: #ffffff;
    }

    button.btn-primary {
      background: rgba(99, 102, 241, 0.2);
      border-color: rgba(99, 102, 241, 0.35);
      color: #c7d2fe;
    }

    button.btn-primary:hover {
      background: var(--accent-color);
      color: #ffffff;
    }

    button.btn-copy {
      background: rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3);
      color: #a7f3d0;
    }

    button.btn-copy:hover {
      background: #10b981;
      border-color: #10b981;
      color: #ffffff;
    }

    button.btn-warning:hover {
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.3);
      color: #fbbf24;
    }

    button.btn-danger {
      background: rgba(239, 68, 68, 0.08);
      border-color: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
    }

    button.btn-danger:hover {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.5);
      color: #ffffff;
    }

    @media (max-width: 600px) {
      body {
        padding: 0.2rem;
      }
      .container {
        height: 98vh;
        border-radius: 8px;
      }
      footer {
        padding: 0.4rem;
      }
      button {
        flex: 1 1 calc(33.33% - 0.35rem);
        padding: 0.4rem 0.3rem;
      }
      .script-modal {
        width: 92%;
        right: 4%;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>✦ Rascunho Limpo</h1>
      </div>
      <div id="statusBadge" class="status-badge">Nenhum ponto fixado</div>
    </header>

    <!-- Modelos Rápidos de Atendimento e Balão de Argumentos -->
    <div class="templates-bar">
      <button class="btn-template" id="btnVr">🚗 Veículo Reserva (Alt+1)</button>
      <button class="btn-template" id="btnCondutor">👤 Condutor (Alt+2)</button>
      <button class="btn-template" id="btnReboque">🛞 Reboque (Alt+3)</button>
      <button class="btn-script-trigger" id="btnToggleScript">💬 Argumentos (Alt+F)</button>
    </div>

    <div class="shortcuts-sub-header">
      <span><kbd>Tab</kbd> / <kbd>Enter</kbd> Próx. Campo</span>
      <span><kbd>Alt</kbd>+<kbd>A</kbd> Copiar</span>
      <span><kbd>Alt</kbd>+<kbd>F</kbd> Argumentos</span>
      <span><kbd>Ctrl</kbd>+<kbd>S</kbd> Fixar</span>
      <span><kbd>Ctrl</kbd>+<kbd>Z</kbd> -1 Palavra</span>
      <span><kbd>Ctrl</kbd>+<kbd>X</kbd> Limpar Rascunho</span>
      <span><kbd>Alt</kbd>+<kbd>C</kbd> Resetar Tudo</span>
    </div>

    <div class="editor-wrapper">
      <textarea id="editor" placeholder="Escreva seu texto base ou selecione um modelo acima..."></textarea>
    </div>

    <!-- Balão Flutuante de Argumentos -->
    <div class="script-modal" id="scriptModal">
      <div class="script-header">
        <h3>💬 Consultar / Inserir Argumentos</h3>
        <button class="close-modal" id="btnCloseModal">✕</button>
      </div>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="Pesquisar (RAM, Venda Direta, Caução, Guincho)...">
      </div>
      <div class="script-content" id="scriptContent"></div>
    </div>

    <footer>
      <div class="controls-grid">
        <button id="btnCopy" class="btn-copy" title="Copiar Nota Completa (Alt + A)">
          <span>📋</span> Copiar (Alt+A)
        </button>
        <button id="btnFix" class="btn-primary" title="Fixar Texto (Ctrl + S)">
          <span>📌</span> Fixar (Ctrl+S)
        </button>
        <button id="btnUndoWord" title="Apagar Palavra (Ctrl + Z)">
          <span>⌫</span> -1 Palavra
        </button>
        <button id="btnRedo" title="Refazer Palavra (Ctrl + Y)">
          <span>↪</span> Refazer
        </button>
        <button id="btnRestoreRascunho" title="Restaurar Rascunho Limpo (Ctrl + R)">
          <span>🔄</span> Restaurar
        </button>
        <button id="btnClear" class="btn-warning" title="Limpar Rascunho (Ctrl + X)">
          <span>🗑</span> Limpar (Ctrl+X)
        </button>
        <button id="btnResetAll" class="btn-danger" title="Zerar tudo incluindo Fixados (Alt + C)">
          <span>🔥</span> Resetar Tudo
        </button>
      </div>
    </footer>
  </div>

  <script>
    const editor = document.getElementById('editor');
    const statusBadge = document.getElementById('statusBadge');
    const btnCopy = document.getElementById('btnCopy');
    const btnFix = document.getElementById('btnFix');
    const btnUndoWord = document.getElementById('btnUndoWord');
    const btnRedo = document.getElementById('btnRedo');
    const btnRestoreRascunho = document.getElementById('btnRestoreRascunho');
    const btnClear = document.getElementById('btnClear');
    const btnResetAll = document.getElementById('btnResetAll');

    const btnVr = document.getElementById('btnVr');
    const btnCondutor = document.getElementById('btnCondutor');
    const btnReboque = document.getElementById('btnReboque');

    const btnToggleScript = document.getElementById('btnToggleScript');
    const scriptModal = document.getElementById('scriptModal');
    const btnCloseModal = document.getElementById('btnCloseModal');
    const scriptContent = document.getElementById('scriptContent');
    const searchInput = document.getElementById('searchInput');

    let pinnedText = null;
    let wordHistory = [];
    let lastClearedDraft = null;

    // Lista de Rótulos e Frases Fixas que NÃO podem ser apagadas com Backspace/Delete
    const protectedPrefixes = [
      "========== VEÍCULO RESERVA ==========",
      "============== CONDUTOR ==============",
      "============== REBOQUE ==============",
      "NOME:", "CHASSI:", "PLACA:", "CPF:", "TEL.:", "CASO:", "END. PAX:", "END. CSS:", "OBS:", "ORIG.:",
      "ASSIST VR SOL.",
      "CIENTE DA PRÉVIA INICIAL DE H ÚTEIS PARA ANÁLISE DO SETOR RESP.",
      ">21 ANOS? SIM", "HAB. > 2 ANOS? SIM", "CC COM LIM. >= R$ 1K? SIM",
      "VIA PÚB? N. SUBSOLO? N. RODAS/CÂMBIO/DIR. TRAVADOS? N.",
      "CIENTE PRAZO INIC. 75 MIN.", "CIENTE AGEND. PARA"
    ];

    const rawTemplates = {
      vr: `========== VEÍCULO RESERVA ==========\nNOME: \nCHASSI: \nPLACA: \nCPF: \nTEL.: \nCASO: SOL. VR POR M\nEND. PAX: \nEND. CSS: \nASSIST VR SOL.\nCIENTE DA PRÉVIA INICIAL DE H ÚTEIS PARA ANÁLISE DO SETOR RESP.`,
      condutor: `============== CONDUTOR ==============\nNOME: \nCPF: \nTEL.: \n>21 ANOS? SIM\nHAB. > 2 ANOS? SIM\nCC COM LIM. >= R$ 1K? SIM\nOBS: `,
      reboque: `============== REBOQUE ==============\nNOME: \nCHASSI: \nPLACA: \nCPF: \nTEL.: \nCASO: SOL. REB POR MOTIVOS \nORIG.: \nVIA PÚB? N. SUBSOLO? N. RODAS/CÂMBIO/DIR. TRAVADOS? N.\nCIENTE PRAZO INIC. 75 MIN.\nCIENTE AGEND. PARA XX ÀS XH`
    };

    // Base de Argumentos e Respostas
    const scriptDatabase = [
      {
        title: "Abordagem Inicial / Confiat",
        text: "Estou vendo aqui em sistema que você precisa de um reboque/ veiculo reserva. Vamos fazer isso agora para vc não ficar esperando. Me confirme qual a placa ou cpf do titular do veiculo?"
      },
      {
        title: "Mesma Categoria / Picape RAM",
        text: "Não há obrigatoriedade contratual de entregar um veículo idêntico ou do mesmo porte (como outra picape RAM). A montadora garante um meio de locomoção, e não a equivalência de modelo. O regulamento prevê a liberação de veículo de categoria intermediária."
      },
      {
        title: "Uso Comercial / Agro",
        text: "Mesmo se você usar a picape para o agronegócio ou transporte de carga, a montadora, por contrato padrão, não se responsabiliza pelo desvio de finalidade. Ela cobre apenas o transporte pessoal do proprietário."
      },
      {
        title: "Reboque - Concessionária Mais Próxima",
        text: "Seguindo a garantia aqui conosco, o reboque gratuito é destinado obrigatoriamente à concessionária autorizada mais próxima do local onde ocorreu o evento."
      },
      {
        title: "Venda Direta / Frotista / CNPJ",
        text: "Identifiquei que seu veículo foi adquirido na modalidade Venda Direta (frotista/produtor rural). Por conta das condições e descontos exclusivos na aquisição, os contratos dessa modalidade não incluem o benefício de veículo reserva pela montadora."
      },
      {
        title: "O que é Regra Institucional",
        text: "Uma diretriz institucional é uma política interna oficial da companhia. Como a modalidade de compra bloqueia essa assistência, o sistema trava e não permite a liberação manual no atendimento."
      },
      {
        title: "Atraso Sistêmico na Devolução do VR",
        text: "O que costuma ocorrer nesses casos é um atraso sistêmico entre oficina, seguradora e locadora. Não faça o pagamento dessas diárias agora no balcão. Vamos abrir um chamado de contestação para alinhar com a locadora e derrubar a cobrança."
      },
      {
        title: "Orientação na Locadora (Cobrança no Caução)",
        text: "Devolva o veículo, pegue o comprovante de entrega e solicite o fechamento pendente para análise da seguradora. Não autorize o débito dessas diárias no seu cartão/caução agora. Vamos formalizar a contestação com urgência."
      },
      {
        title: "Análise do Caução no Balcão",
        text: "A vistoria do veículo e a análise do caução são feitas imediatamente na devolução. Caso o carro próprio tenha sido liberado e o reserva mantido após o prazo, a locadora cobra as diárias excedentes."
      }
    ];

    function toggleScriptModal() {
      if (scriptModal.classList.contains('active')) {
        scriptModal.classList.remove('active');
        editor.focus();
      } else {
        scriptModal.classList.add('active');
        setTimeout(() => searchInput.focus(), 100);
      }
    }

    function renderScripts(data) {
      scriptContent.innerHTML = '';
      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'script-card';
        card.innerHTML = `
          <div class="script-title">${item.title}</div>
          <div class="script-text">${item.text}</div>
          <button class="btn-insert" onclick="insertScriptText(${index})">+ Inserir no Bloco</button>
        `;
        scriptContent.appendChild(card);
      });
    }

    function filterScripts() {
      const query = searchInput.value.toLowerCase();
      const filtered = scriptDatabase.filter(item => 
        item.title.toLowerCase().includes(query) || item.text.toLowerCase().includes(query)
      );
      renderScripts(filtered);
    }

    function insertScriptText(index) {
      const item = scriptDatabase[index];
      if (item) {
        const currentPos = editor.selectionStart;
        const text = editor.value;
        const insertText = (currentPos > 0 && !text.endsWith('\n') ? '\n' : '') + item.text;
        
        editor.value = text.slice(0, currentPos) + insertText + text.slice(currentPos);
        editor.focus();
        editor.setSelectionRange(currentPos + insertText.length, currentPos + insertText.length);
      }
    }

    function loadTemplate(key) {
      if (rawTemplates[key]) {
        const textToInsert = rawTemplates[key];
        const currentContent = editor.value.trim();

        if (currentContent === '') {
          editor.value = textToInsert;
        } else {
          editor.value += '\n\n' + textToInsert;
        }
        editor.focus();
        jumpToNextField();
      }
    }

    function getTabStops() {
      const text = editor.value;
      const stops = [];
      const lines = text.split('\n');
      let accumulated = 0;

      for (let line of lines) {
        const isIgnored = line.includes('=======
